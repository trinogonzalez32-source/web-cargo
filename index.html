  <style>
    :root {
      --paper: #F7F6F2;
      --paper-alt: #ECE8DE;
      --card: #FFFFFF;
      --ink: #0E1F3D;
      --muted: #526074;
      --line: #DCDAD3;
      --line-strong: #0E1F3D;
      --gold: #C59B27;
      --gold-soft: rgba(197, 155, 39, 0.14);
      --tri-yellow: #FCD116;
      --tri-blue: #003893;
      --tri-red: #CE1126;
      --ok: #166534;
      --danger: #991B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      max-width: 100%;
      overflow-x: clip;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
      max-width: 100%;
      overflow-x: clip;
    }

    .wrap {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .topbar {
      background: var(--ink);
      color: var(--paper);
      font-size: 12px;
      letter-spacing: 0.02em;
      padding: 9px 0;
    }

    .topbar-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .topbar-accent {
      color: #E5BE5A;
      font-weight: 600;
    }

    header.site-header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      gap: 20px;
    }

    .cargo-logo {
      text-decoration: none;
      color: var(--ink);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .cargo-logo-sub {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .cargo-logo-main {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 0.98;
      text-transform: uppercase;
      color: var(--ink);
    }

    .cargo-logo-tri {
      display: flex;
      width: 100%;
      height: 4px;
      margin-top: 4px;
    }

    .cargo-logo-tri span:nth-child(1) { flex: 1; background: var(--tri-yellow); }
    .cargo-logo-tri span:nth-child(2) { flex: 1; background: var(--tri-blue); }
    .cargo-logo-tri span:nth-child(3) { flex: 1; background: var(--tri-red); }

    .cargo-logo-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 4px;
    }

    .cargo-logo-stars svg {
      width: 8px;
      height: 8px;
      fill: var(--ink);
      display: block;
    }

    nav.main-nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav.main-nav a {
      text-decoration: none;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      padding-bottom: 2px;
      border-bottom: 1.5px solid transparent;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    nav.main-nav a:hover {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--ink);
      cursor: pointer;
      transition: all 0.18s ease;
      background: transparent;
      color: var(--ink);
    }

    .btn-solid {
      background: var(--ink);
      color: #FFFFFF;
    }

    .btn-solid:hover {
      background: #1C355E;
      border-color: #1C355E;
    }

    .btn-ghost:hover {
      background: var(--paper-alt);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 12px;
    }

    .hero-band {
      padding: 56px 0;
      border-bottom: 1px solid var(--line);
    }

    .hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
      gap: 44px;
      align-items: center;
    }

    .kicker {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    h1.hero-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(34px, 5.2vw, 54px);
      font-weight: 700;
      line-height: 1.07;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }

    .hero-lead {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 24px;
      max-width: 620px;
    }

    .hero-cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .commission-card {
      background: var(--card);
      border: 1.5px solid var(--ink);
      padding: 26px;
      box-shadow: 8px 8px 0 var(--paper-alt);
    }

      font-family: 'Fraunces', Georgia, serif;
      font-size
